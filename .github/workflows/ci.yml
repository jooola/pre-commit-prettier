name: CI

on:
  push:
    branches: [main]

  schedule:
    - cron: "15 8 * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

      - run: pip install git+https://github.com/jooola/pre-commit-hook-sync@v0.1.0

      - run: |
          pre-commit-hook-sync -vv \
            https://x:${GITHUB_TOKEN}@github.com/prettier/prettier \
            --upstream-pattern '*.*.*' \
            --file .npmignore \
            --file .pre-commit-hooks.yaml \
            --file LICENSE \
            --file package.json \
            --file README.md \
            --push
