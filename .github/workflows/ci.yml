name: CI

on:
  push:
    branches: [main]

  schedule:
    - cron: "15 8 * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7

      - run: pip install git+https://github.com/jooola/pre-commit-hook-sync@v0.1.0

      - run: |
          pre-commit-hook-sync -vv \
            https://x:${GITHUB_TOKEN}@github.com/prettier/prettier \
            --upstream-pattern '*.*.*' \
            --file .npmignore \
            --file .pre-commit-hooks.yaml \
            --file LICENSE \
            --file package.json \
            --file README.md \
            --push
